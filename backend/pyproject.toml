[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greencity"
version = "0.1.0"
description = "GreenCity AI – Agentic Decision Support for Urban Green Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "numpy>=1.26.0",
    "langgraph>=0.2.0",
    "earthaccess>=0.11.0",
    "rasterio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/greencity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
